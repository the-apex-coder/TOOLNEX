
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compress images online for free with TOOLNEX.">
    <title>Image Compressor | TOOLNEX</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/image-compressor.css">
</head>
<body>

    <header class="navbar">
        <a href="../index.html" class="logo">TOOL<span>NEX</span><i>.</i></a>
        <a href="../index.html" class="nav-button">← Back to Home</a>
    </header>

    <main class="compressor-page">

        <div class="compressor-heading">
            <span class="section-label">TOOLNEX IMAGE TOOLS</span>
            <h1>Image <span>Compressor.</span></h1>
            <p>Compress your images while keeping their quality.</p>
        </div>

        <section class="compressor-box">

            <label for="imageInput" class="upload-area" id="uploadArea">
                <div class="upload-icon">↑</div>
                <h2>Drop your image here</h2>
                <p>or click to browse your device</p>
                <span>JPG, PNG, WEBP supported</span>
                <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
            </label>

            <div class="editor" id="editor" hidden>

                <div class="preview-area">
                    <div>
                        <span class="preview-label">ORIGINAL IMAGE</span>
                        <img id="originalPreview" alt="Original image preview">
                        <p id="originalInfo"></p>
                    </div>

                    <div>
                        <span class="preview-label">COMPRESSED IMAGE</span>
                        <img id="compressedPreview" alt="Compressed image preview">
                        <p id="compressedInfo">Not compressed yet</p>
                    </div>
                </div>

                <div class="settings">
                    <div class="setting-heading">
                        <label for="quality">Compression Quality</label>
                        <strong id="qualityValue">70%</strong>
                    </div>

                    <input type="range" id="quality" min="10" max="100" value="70">

                    <div class="quality-labels">
                        <span>Smaller file</span>
                        <span>Better quality</span>
                    </div>

                    <label for="format">Output Format</label>
                    <select id="format">
                        <option value="image/webp">WebP</option>
                        <option value="image/jpeg">JPG</option>
                        <option value="image/png">PNG</option>
                    </select>

                    <button id="compressBtn" class="compress-button">
                        Compress Image ↗
                    </button>

                    <button id="downloadBtn" class="download-button" disabled>
                        Download Image ↓
                    </button>

                    <button id="resetBtn" class="reset-button">
                        Choose Another Image
                    </button>

                    <p id="statusMessage" role="status"></p>
                </div>

            </div>

        </section>

        <p class="privacy-note">🔒 Your images are processed locally in your browser.</p>

    </main>

    <script src="../js/image-compressor.js"></script>
</body>
</html>
